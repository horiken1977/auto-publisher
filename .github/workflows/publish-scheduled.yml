name: Publish Qiita articles on schedule

# 公開予定の時刻（JST）を過ぎてから24時間以内に起動した回で、その記事を1本だけ公開する。
# GitHub Actions の cron は混雑時に数時間遅れることがあり（実績で最大9時間超）、起動が抜けることもある。
# そのため、本番の起動（月・木 14:00 UTC = 23:00 JST）のほかに予備の起動を2回入れている。
# 二重投稿は「公開予定の時刻のあとに記事が1本でも出ていれば公開しない」ガードで防ぐ。
on:
  schedule:
    - cron: '0 14 * * 1,4'    # 月・木 23:00 JST（本番）
    - cron: '30 20 * * 1,4'   # 火・金 05:30 JST（予備）
    - cron: '30 3 * * 2,5'    # 火・金 12:30 JST（予備）
  workflow_dispatch:
    inputs:
      article:
        description: '手動公開する記事のベース名 (例: ex-receipt-02)。空ならスケジュール表に従う。'
        required: false
        default: ''
      dry_run:
        description: '予行演習（true なら判定とガードまで行い、公開はしない）'
        type: boolean
        required: false
        default: false
      now:
        description: '予行演習で使う「今」の時刻 (例: 2026-10-08T14:00:00Z)。空なら実際の時刻。'
        required: false
        default: ''

permissions:
  contents: read

# 本番と予備の起動が重なっても、同時に公開に進まないようにする
concurrency:
  group: qiita-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Qiita CLI
        run: npm install

      - name: 公開対象の記事を決定
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.article }}
          NOW_INPUT: ${{ github.event.inputs.now }}
        run: |
          # 公開スケジュール（記事のベース名 と 公開予定の時刻 JST）
          SCHEDULE="
          ex-receipt-02 2026-10-08T23:00:00+09:00
          ex-receipt-03 2026-10-12T23:00:00+09:00
          ex-receipt-04 2026-10-15T23:00:00+09:00
          ex-receipt-05 2026-10-19T23:00:00+09:00
          "
          WINDOW=$((24 * 3600))

          if [ -n "$NOW_INPUT" ]; then
            NOW=$(date -u -d "$NOW_INPUT" +%s)
            echo "「今」の時刻（指定）: $(date -u -d "@$NOW" '+%Y-%m-%d %H:%M UTC')"
          else
            NOW=$(date -u +%s)
            echo "「今」の時刻: $(date -u -d "@$NOW" '+%Y-%m-%d %H:%M UTC')"
          fi

          NAME=""
          SCHED=""
          if [ -n "$MANUAL" ]; then
            echo "手動指定: $MANUAL"
            NAME="$MANUAL"
            SCHED=$NOW
          else
            while read -r n t; do
              [ -z "$n" ] && continue
              s=$(date -u -d "$t" +%s)
              if [ "$NOW" -ge "$s" ] && [ "$NOW" -lt $((s + WINDOW)) ]; then
                NAME="$n"
                SCHED="$s"
                echo "公開対象: $n（公開予定 $t、予定から $(( (NOW - s) / 60 )) 分後の起動）"
                break
              fi
            done <<< "$SCHEDULE"
            [ -z "$NAME" ] && echo "いまは公開予定の記事がありません。"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sched=$SCHED" >> "$GITHUB_OUTPUT"

      - name: 二重投稿ガード
        id: guard
        if: steps.pick.outputs.name != ''
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          NAME: ${{ steps.pick.outputs.name }}
          SCHED: ${{ steps.pick.outputs.sched }}
          MANUAL: ${{ github.event.inputs.article }}
        run: |
          FILE="public/$NAME.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::ファイルが見つかりません: $FILE"
            exit 1
          fi
          RAW=$(sed -n 's/^title:[[:space:]]*//p' "$FILE" | head -n1)
          TITLE=$(printf '%s' "$RAW" | sed -e 's/^"//' -e 's/"$//')
          echo "対象タイトル: $TITLE"

          # API がエラーを返したら（トークン切れなど）、公開を飛ばさずに失敗として止める
          CODE=$(curl -s -o items.json -w '%{http_code}' \
            -H "Authorization: Bearer $QIITA_TOKEN" \
            "https://qiita.com/api/v2/authenticated_user/items?per_page=100")
          if [ "$CODE" != "200" ]; then
            echo "::error::Qiita API がエラーを返しました（HTTP $CODE）。QIITA_TOKEN が有効か確かめてください。"
            head -c 300 items.json; echo
            exit 1
          fi
          echo "Qiita API: OK（トークンは有効）"

          # 1. 同じタイトルの記事が既にあれば公開しない
          SAME=$(jq --arg t "$TITLE" '[.[] | select(.title == $t)] | length' items.json)
          if [ "$SAME" != "0" ]; then
            echo "同じタイトルの記事が既に $SAME 件あります。公開しません。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. 公開予定の時刻のあとに記事が出ていれば、この回は公開済みと見なす
          #    （公開後に Qiita でタイトルを変えても、予備の起動で二重に投稿しない）
          if [ -z "$MANUAL" ]; then
            AFTER=0
            while read -r c; do
              [ -z "$c" ] && continue
              if [ "$(date -u -d "$c" +%s)" -ge "$SCHED" ]; then
                AFTER=$((AFTER + 1))
              fi
            done < <(jq -r '.[].created_at' items.json)
            if [ "$AFTER" != "0" ]; then
              echo "公開予定の時刻のあとに記事が $AFTER 件出ています。この回は公開済みと見なし、公開しません。"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "既存の記事なし。公開に進みます。"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 予行演習の結果
        if: github.event.inputs.dry_run == 'true'
        run: |
          if [ -z "${{ steps.pick.outputs.name }}" ]; then
            echo "予行演習：公開する記事はありません。"
          elif [ "${{ steps.guard.outputs.skip }}" = "true" ]; then
            echo "予行演習：${{ steps.pick.outputs.name }} はガードで公開しません。"
          else
            echo "予行演習：本番なら ${{ steps.pick.outputs.name }} を公開します（今回は公開していません）。"
          fi

      - name: Qiita に公開
        if: steps.pick.outputs.name != '' && steps.guard.outputs.skip == 'false' && github.event.inputs.dry_run != 'true'
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          echo "公開: ${{ steps.pick.outputs.name }}"
          npx qiita publish "${{ steps.pick.outputs.name }}"
